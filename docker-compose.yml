# Local standalone. Publishes on loopback only. Direction 1 needs PF_BASE_URL, which has no default (set it in your shell or a .env next to this file).
services:
  cimd-lab:
    restart: unless-stopped
    build: .
    ports:
      - "127.0.0.1:5250:5250"
    environment:
      SHELF_URL: ${SHELF_URL:-http://127.0.0.1:4400}
      BIND: "0.0.0.0"   # inside the container only; the Host check still accepts loopback names only
      PORT: "5250"
      PF_BASE_URL: "${PF_BASE_URL:-}"   # empty = direction 1 off; nothing is contacted
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-cimd-lab.local.ping-devops.com}
      CIMD_CLIENT_DEV_LOCAL_URL: "${CIMD_CLIENT_DEV_LOCAL_URL:-}"    # the local client.dev clone lane; empty = preset off
      CIMD_CLIENT_DEV_LOCAL_REDIRECT: "${CIMD_CLIENT_DEV_LOCAL_REDIRECT:-}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
