# Local standalone. Publishes on loopback only. Direction 1 needs PF_BASE_URL (set it in your shell or a .env next to this file).
services:
  cimd-lab:
    build: .
    ports:
      - "127.0.0.1:5250:5250"
    environment:
      BIND: "0.0.0.0"   # inside the container only; the Host check still accepts loopback names only
      PORT: "5250"
      PF_BASE_URL: "${PF_BASE_URL:-https://pf.example:9031}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
