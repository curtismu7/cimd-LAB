name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm ci
      - run: npm run build

  test:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm ci
      - name: server tests (each file isolated, so a hang names its file)
        run: |
          cd server
          for f in test/*.test.js; do
            echo "=== $f"
            timeout 120 node --test --test-timeout=30000 --test-reporter=spec "$f" || { echo "STUCK OR FAILED: $f"; exit 1; }
          done
      - name: web tests
        run: cd web && npx vitest run
      - run: bash scripts/check-ui-standard.sh
      - name: SE manifests render (dry run, no cluster)
        run: NAMESPACE=ci IMAGE=registry.invalid/cimd-lab:ci SE_HOST=cimd-lab.invalid PF_BASE_URL=https://pf.invalid DRY_RUN=1 scripts/deploy-se.sh > /dev/null

  doctor:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm ci
      - run: npm run build
      - run: PORT=5290 npm run doctor
      - name: content pack validates
        run: node scripts/validate-content-pack.mjs

  forbidden-strings:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan history and tree (counts only, the list is never printed)
        env:
          FORBIDDEN_STRINGS: ${{ secrets.FORBIDDEN_STRINGS }}
        run: |
          list="$RUNNER_TEMP/forbidden.txt"
          printf '%s\n' "$FORBIDDEN_STRINGS" | grep -v '^$' > "$list" || true
          test -s "$list" || { echo "FORBIDDEN_STRINGS secret is empty"; exit 1; }
          hist=$(git log -p --all | grep -cF -f "$list" || true)
          tree=$(git grep -l -F -f "$list" -- . || true)
          tree_count=$(printf '%s' "$tree" | grep -c . || true)
          echo "history hits: $hist"
          echo "tree files with hits: $tree_count"
          test "$hist" = "0" && test "$tree_count" = "0"

  gitleaks:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          ver=8.18.4
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) f="gitleaks_${ver}_linux_x64.tar.gz" ;;
            Darwin-arm64) f="gitleaks_${ver}_darwin_arm64.tar.gz" ;;
            Darwin-x86_64) f="gitleaks_${ver}_darwin_x64.tar.gz" ;;
            *) echo "unsupported runner platform"; exit 1 ;;
          esac
          base=https://github.com/gitleaks/gitleaks/releases/download/v$ver
          curl -sSLO "$base/$f"
          curl -sSLO "$base/gitleaks_${ver}_checksums.txt"
          grep " $f\$" "gitleaks_${ver}_checksums.txt" | shasum -a 256 -c -
          tar -xz -f "$f" gitleaks
          ./gitleaks version
      - name: Scan history
        run: ./gitleaks detect --source . --redact --no-banner --verbose
