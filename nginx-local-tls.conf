# TLS front for the local-PF override: PingFederate (in Docker) fetches the lab's own document over https.
server {
  listen 5251 ssl;
  ssl_certificate /certs/tls.pem;
  ssl_certificate_key /certs/tls-key.pem;
  location / {
    proxy_pass http://cimd-lab:5250;
    proxy_set_header Host 127.0.0.1:5250;   # the app accepts loopback Host names only
  }
}
